<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- roxo da marca: violeta do gráfico → roxo da barra lateral -->
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".55" stop-color="#5b1ee6"/>
      <stop offset="1" stop-color="#4c0fd0"/>
    </linearGradient>
    <!-- toque do azul do gráfico no canto -->
    <radialGradient id="azul" cx="1" cy="1" r=".75">
      <stop offset="0" stop-color="#3b9bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3b9bff" stop-opacity="0"/>
    </radialGradient>
    <!-- leve brilho no topo -->
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fundo)"/>
  <rect width="64" height="64" rx="15" fill="url(#azul)"/>
  <rect width="64" height="64" rx="15" fill="url(#brilho)"/>
  <!-- K maiúsculo -->
  <g fill="#fff" transform="translate(-3 0)">
    <path d="M18 14h9.5v36H18z"/>
    <path d="M27.5 28.5 39.5 14H51L27.5 42z"/>
    <path d="M33.2 33.8 39.6 26.6 52 50H41.6z"/>
  </g>
</svg>
