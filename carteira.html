<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYLRO | Carteira</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="description" content="Suas moedas na KYLRO com o valor em reais atualizado ao vivo e a variação das últimas 24 horas.">
  <meta name="theme-color" content="#4c0fd0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- liga a transição entre páginas já no HTML (não depende do CSS ter baixado) -->
  <style>@view-transition { navigation: auto; }</style>
  <link rel="stylesheet" href="css/carteira.css?v=20261127e">
  <link rel="stylesheet" href="css/navegacao.css?v=20261127e">
  <!-- navegação mais rápida: quando o dedo toca num link (ou o mouse para em cima), o navegador
       já prepara a próxima página; o início só é baixado, sem rodar antes da hora -->
  <script type="speculationrules">
    {
      "prerender": [{ "where": { "and": [{ "href_matches": "/*" }, { "not": { "href_matches": "/*index.html" } }] }, "eagerness": "moderate" }],
      "prefetch": [{ "where": { "href_matches": "/*index.html" }, "eagerness": "moderate" }]
    }
  </script>
</head>
<body>
  <main class="carteira">

    <header class="topo">
      <a href="index.html" class="back" aria-label="Voltar para o início">
        <svg viewBox="0 0 24 24"><path d="M22 12H3"/><path d="M12 3l-9 9 9 9"/></svg>
      </a>
      <div>
        <h1 class="titulo">Carteira</h1>
        <p class="sub">Seu patrimônio digital</p>
      </div>
    </header>

    <section class="ativos">
      <h2 class="ativos-titulo">Meus ativos</h2>
      <p class="ativos-qtd" id="qtd">
        <span class="ao-vivo" id="aoVivo" data-estado="carregando"><i></i>carregando</span>
        <span class="contagem"></span>
      </p>

      <!-- preenchido por js/carteira.js a partir do estado da carteira -->
      <div class="lista" id="lista"></div>

      <p class="total">Total <strong id="total">R$ —</strong></p>

      <!-- volta aos saldos iniciais (útil para quem está testando o projeto) -->
      <div class="reiniciar">
        <button type="button" class="reiniciar-btn" id="reiniciarBtn">Reiniciar demonstração</button>
        <div class="reiniciar-confirmar" id="reiniciarConfirmar" hidden>
          <p>Voltar aos saldos iniciais e apagar o histórico?</p>
          <div>
            <button type="button" class="cancelar">Cancelar</button>
            <button type="button" class="confirmar">Reiniciar</button>
          </div>
        </div>
        <p class="reiniciar-aviso" id="reiniciarAviso" role="status"></p>
      </div>
    </section>
  </main>

  <script type="module" src="js/core/navegacao.js?v=20261127e"></script>
  <script type="module" src="js/carteira.js?v=20261127e"></script>
</body>
</html>
