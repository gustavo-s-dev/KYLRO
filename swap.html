<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYLRO | Swap</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="description" content="Simule trocas entre criptomoedas pela cotação do momento: pague com BTC, SOL ou AAVE e receba USDT, ETH, XRP e outras.">
  <meta name="theme-color" content="#4c0fd0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/swap.css?v=20261127d">
  <link rel="stylesheet" href="css/navegacao.css?v=20261127d">
</head>
<body>
  <main class="swap">

    <a href="index.html" class="back" aria-label="Voltar para o início">
      <svg viewBox="0 0 48 32"><path d="M46 16H4"/><path d="M16 3L3 16l13 13"/></svg>
    </a>

    <section class="swap-box">
      <article class="card card-pay">
        <h2 class="card-label">você paga</h2>
        <div class="card-row">
          <button type="button" class="token" id="payToken" aria-haspopup="dialog"></button>
          <p class="amount" id="payAmount"></p>
        </div>
        <p class="saldo" id="saldo"></p>
      </article>

      <button class="invert" id="invertBtn" aria-label="Inverter moedas">
        <svg viewBox="0 0 40 40">
          <path d="M13 34V7"/><path d="M6 14l7-7 7 7"/>
          <path d="M27 6v27"/><path d="M20 26l7 7 7-7"/>
        </svg>
      </button>

      <article class="card card-receive">
        <h2 class="card-label">você recebe</h2>
        <div class="card-row">
          <button type="button" class="token" id="receiveToken" aria-haspopup="dialog"></button>
          <p class="amount" id="receiveAmount"></p>
        </div>
      </article>

      <p class="taxa" id="taxa" aria-live="polite"></p>
    </section>

    <div class="limits">
      <button type="button" data-limit="min">MÍN</button>
      <button type="button" data-limit="max">MAX</button>
    </div>

    <div class="slider" id="slider">
      <span class="slider-thumb" id="sliderThumb" role="button" tabindex="0"
            aria-label="Confirmar swap: deslize para a direita ou pressione Enter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg>
      </span>
      <span class="slider-text" id="sliderText" aria-live="polite">deslize para swap</span>
      <span class="slider-arrows">
        <svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg>
        <svg viewBox="0 0 24 24" class="soft"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg>
      </span>
    </div>

    <p class="note">As transações estão sujeitas à cotação do mercado.</p>
  </main>

  <!-- lista para escolher a moeda (preenchida por js/swap.js) -->
  <div class="seletor" id="seletor" role="dialog" aria-modal="true" aria-labelledby="seletorTitulo" hidden>
    <div class="seletor-caixa">
      <header class="seletor-topo">
        <h2 class="seletor-titulo" id="seletorTitulo"></h2>
        <button type="button" class="seletor-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </header>
      <ul class="seletor-lista" id="seletorLista"></ul>
    </div>
  </div>

  <script type="module" src="js/core/navegacao.js?v=20261127d"></script>
  <script type="module" src="js/swap.js?v=20261127d"></script>
</body>
</html>
